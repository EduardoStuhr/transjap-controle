<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Transjap Sistema" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Transjap Sistema</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070c;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 36%, rgba(44, 107, 205, 0.24), transparent 34rem),
          linear-gradient(180deg, #05070c 0%, #0a101b 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: max(32px, env(safe-area-inset-top)) 32px max(32px, env(safe-area-inset-bottom));
        text-align: center;
      }

      .brand {
        width: min(168px, 46vw);
        height: min(168px, 46vw);
        object-fit: contain;
        filter: drop-shadow(0 24px 48px rgba(34, 95, 190, 0.34));
        animation: fade-in 720ms ease-out both;
      }

      h1 {
        margin: 26px 0 10px;
        font-size: clamp(1.45rem, 6vw, 2.2rem);
        font-weight: 800;
        letter-spacing: 0;
      }

      p {
        width: min(320px, 88vw);
        margin: 0 auto;
        color: #a8b3c7;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .progress {
        width: min(220px, 64vw);
        height: 4px;
        margin: 28px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
      }

      .progress span {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #173c7e, #5e91e7);
        animation: loading 1.1s ease-in-out infinite;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-label="Carregando Transjap Sistema">
        <img class="brand" src="./app-icon-foreground.png" alt="" />
        <h1>Transjap Sistema</h1>
        <p>Carregando ambiente operacional seguro.</p>
        <div class="progress" aria-hidden="true"><span></span></div>
      </section>
    </main>
    <script>
      window.setTimeout(() => {
        window.location.replace("https://sistema-transjap.com.br");
      }, 450);
    </script>
  </body>
</html>

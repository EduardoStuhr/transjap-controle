<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Transjap Sistema" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Sem conexao - Transjap Sistema</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070c;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 28%, rgba(44, 107, 205, 0.22), transparent 30rem),
          linear-gradient(180deg, #05070c 0%, #0a101b 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
        text-align: center;
      }

      .panel {
        width: min(360px, 100%);
        animation: enter 520ms ease-out both;
      }

      img {
        width: 124px;
        height: 124px;
        object-fit: contain;
        filter: drop-shadow(0 20px 42px rgba(34, 95, 190, 0.3));
      }

      h1 {
        margin: 24px 0 10px;
        font-size: clamp(1.45rem, 7vw, 2.15rem);
        font-weight: 850;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #a8b3c7;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 26px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #173c7e, #e8b53a);
        color: #05070c;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 18px 34px rgba(24, 78, 171, 0.28);
      }

      small {
        display: block;
        margin-top: 16px;
        color: #74839a;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <img src="./app-icon-foreground.png" alt="" />
        <h1>Sem conexao</h1>
        <p>Nao foi possivel carregar o Transjap Sistema. Verifique a internet e tente novamente.</p>
        <button type="button" id="retry">Reconectar</button>
        <small id="status">Aguardando rede...</small>
      </section>
    </main>
    <script>
      const targetUrl = "https://sistema-transjap.com.br";
      const status = document.querySelector("#status");
      let retryTimer;

      const retry = () => {
        status.textContent = navigator.onLine ? "Reconectando..." : "Ainda sem internet";
        if (navigator.onLine) window.location.replace(targetUrl);
      };

      document.querySelector("#retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      window.addEventListener("offline", () => {
        status.textContent = "Aguardando rede...";
      });

      retryTimer = window.setInterval(() => {
        if (navigator.onLine) retry();
      }, 5000);
      window.addEventListener("pagehide", () => window.clearInterval(retryTimer));
    </script>
  </body>
</html>
